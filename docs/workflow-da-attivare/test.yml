name: Test automatici
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: isa, POSTGRES_PASSWORD: isa_dev_pw, POSTGRES_DB: isa_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt
      - run: cd server && python -m tests.run
        env: { TEST_DATABASE_URL: "postgresql://isa:isa_dev_pw@127.0.0.1:5432/isa_test" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm install && node build.mjs
