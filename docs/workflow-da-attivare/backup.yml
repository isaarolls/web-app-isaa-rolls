# Backup notturno indipendente dall'hosting: copia compressa del database conservata 90 giorni
# negli "Artifacts" di GitHub. Richiede il segreto PROD_DATABASE_URL (URL esterno del database Render).
name: Backup database
on:
  schedule: [{ cron: "30 1 * * *" }]   # ogni notte alle 01:30 UTC
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client
      - name: Dump
        env: { DATABASE_URL: "${{ secrets.PROD_DATABASE_URL }}" }
        run: |
          test -n "$DATABASE_URL" || { echo "Segreto PROD_DATABASE_URL mancante"; exit 1; }
          pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" -f isa-manager-$(date +%F).dump
          ls -lh *.dump
      - uses: actions/upload-artifact@v4
        with: { name: "backup-${{ github.run_id }}", path: "*.dump", retention-days: 90 }
