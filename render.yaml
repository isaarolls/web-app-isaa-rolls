services:
  - type: web
    name: isa-manager
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        value: capacitor://localhost,https://localhost,http://localhost
      - key: TZ
        value: Europe/Rome
