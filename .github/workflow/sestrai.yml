name: Estrai progetto
on:
  push:
    paths: ['**.zip', '.github/workflows/estrai.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  estrai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          [ -n "$Z" ] || { echo "Nessuno zip da estrarre"; exit 0; }
          unzip -q -o "$Z" -d /tmp/x
          mkdir -p docs/workflow-da-attivare
          cp /tmp/x/isa-manager/.github/workflows/*.yml docs/workflow-da-attivare/
          rm -rf /tmp/x/isa-manager/.github
          cp -a /tmp/x/isa-manager/. .
          git rm -q "$Z"
          git config user.name "isaarolls"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Progetto Isa Manager estratto"
          git push
